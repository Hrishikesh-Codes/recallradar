name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: recallradar
          POSTGRES_PASSWORD: recallradar
          POSTGRES_DB: recallradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recallradar -d recallradar"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://recallradar:recallradar@localhost:5432/recallradar
      TEST_DATABASE_URL: postgresql+psycopg://recallradar:recallradar@localhost:5432/recallradar
      # Fail, don't skip, if the database is unreachable.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag; pinned to a commit as its README recommends.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # The embedding model (~67 MB) that the matching tests load.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/recallradar/models
          key: embedding-model-bge-small-en-v1.5
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: Migrations apply to an empty database
        run: uv run alembic -c packages/core/alembic.ini upgrade head
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: OpenAPI schema is committed and current
        run: |
          uv run recallradar-openapi apps/web/src/lib/api/openapi.json
          git diff --exit-code apps/web/src/lib/api/openapi.json

  web:
    name: Web (lint, types, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      # Better Auth refuses its default secret; this run gets a throwaway one.
      - run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated API types match the schema
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api/schema.d.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  api-image:
    name: API Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t recallradar-api:ci .
      - name: Container starts and answers /healthz
        run: |
          docker run -d --name api -p 7860:7860 recallradar-api:ci
          for i in $(seq 1 30); do curl -fs localhost:7860/healthz && exit 0; sleep 1; done
          docker logs api; exit 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
