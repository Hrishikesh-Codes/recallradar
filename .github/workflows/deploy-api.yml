name: Deploy API to Hugging Face Spaces

# Pushes the repo to the Space's git remote; the Space builds apps/api/Dockerfile. Runs on pushes
# to main that touch the API, or by hand. Does nothing until HF_TOKEN and HF_SPACE are set.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }} # "user/space-name"
    steps:
      - name: Skip until the Space is configured
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "Set the HF_TOKEN secret and HF_SPACE variable to deploy." && exit 0
      - uses: actions/checkout@v7
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
      - name: Push to the Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          set -euo pipefail
          deploy=$(mktemp -d)
          # Only what the image needs (the Dockerfile copies the context; .dockerignore trims it).
          tar --exclude=.git --exclude=apps/web --exclude=data --exclude=tests -cf - . | tar -xf - -C "$deploy"
          cp apps/api/Dockerfile "$deploy/Dockerfile"
          cat > "$deploy/README.md" <<'README'
          ---
          title: RecallRadar API
          emoji: 📡
          colorFrom: yellow
          colorTo: gray
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          The RecallRadar API. Source: https://github.com/Hrishikesh-Codes/recallradar
          README
          cd "$deploy"
          git init -q -b main
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
