[project]
name = "recallradar-api"
version = "0.1.0"
description = "RecallRadar HTTP API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143",
  "recallradar-core",
  "sentry-sdk[fastapi]>=2.72",
  "uvicorn[standard]>=0.54",
]

[project.scripts]
recallradar-openapi = "recallradar_api.openapi:main"

[dependency-groups]
dev = ["httpx>=0.28"]

[tool.uv.sources]
recallradar-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
