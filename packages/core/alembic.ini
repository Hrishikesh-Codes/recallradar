# Alembic config. The database URL comes from DATABASE_URL via recallradar_core.settings,
# never from this file. Run from the repo root:  make migrate
[alembic]
script_location = recallradar_core:migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
