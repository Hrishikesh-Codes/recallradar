[project]
name = "recallradar-core"
version = "0.1.0"
description = "Shared settings, logging, and database models for RecallRadar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.20",
  "pgvector>=0.5",
  "psycopg[binary]>=3.3",
  "pydantic>=2.14",
  "pydantic-settings>=2.15",
  "sqlalchemy>=2.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
