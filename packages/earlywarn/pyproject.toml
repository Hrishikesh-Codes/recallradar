[project]
name = "recallradar-earlywarn"
version = "0.1.0"
description = "Complaint-surge detection and out-of-time backtest against historical recalls."
requires-python = ">=3.12,<3.13"
dependencies = ["recallradar-core"]

[tool.uv.sources]
recallradar-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
