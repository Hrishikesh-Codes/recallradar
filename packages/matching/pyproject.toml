[project]
name = "recallradar-matching"
version = "0.1.0"
description = "Product <-> recall matching: normalization, candidate generation, scoring, calibration, eval."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.9",
    "recallradar-core",
    "recallradar-identify",
    "recallradar-ingest",
]

[tool.uv.sources]
recallradar-core = { workspace = true }
recallradar-identify = { workspace = true }
recallradar-ingest = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
