[project]
name = "recallradar-workspace"
version = "0.0.0"
description = "RecallRadar monorepo (Python workspace root, not a package)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=2.4",
  "pytest>=9.1",
  "pytest-cov>=7.0",
  "ruff>=0.17",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/*", "jobs"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "PTH", "DTZ", "PL", "TID",
]
ignore = [
  "PLR0913",  # too many arguments: SQLAlchemy/FastAPI signatures make this noisy
  "PLR2004",  # magic values: too strict for parsers and tests
  "SIM905",  # "a b c".split() reads better than a long list literal for word lists
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "S105", "S106"]
"**/migrations/versions/*.py" = ["N999", "F401", "E501"]  # generated; template imports pgvector

[tool.ruff.lint.isort]
known-first-party = ["recallradar_*"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["/migrations/versions/", "apps/web/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "db: needs a Postgres database (DATABASE_URL); skipped when unavailable",
  "live: calls a real external API; skipped unless RUN_LIVE_TESTS=1",
]
testpaths = ["packages", "apps/api", "jobs", "tests"]

[tool.coverage.run]
source = ["packages", "apps/api/src", "jobs/src"]
omit = ["*/migrations/*", "*/tests/*"]
